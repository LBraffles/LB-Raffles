<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LB Raffles</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#080808;color:white}
header{text-align:center;padding:25px;border-bottom:1px solid #333}
.logo{font-size:30px;font-weight:bold;letter-spacing:2px}
.logo span{color:#d4af37}
.container{max-width:800px;margin:auto;padding:25px 15px}
.hero{text-align:center;padding:30px 0}
.badge{background:#d4af37;color:#000;padding:8px 15px;border-radius:20px;font-weight:bold}
h1{font-size:35px}
.prize{color:#d4af37;font-size:25px;font-weight:bold}
.card{background:#111;border:1px solid #333;border-radius:15px;padding:20px;margin-bottom:20px}
.price{font-size:24px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}
.number{padding:14px 5px;background:#1b1b1b;color:white;border:1px solid #444;border-radius:8px;font-weight:bold}
.number.selected{background:#d4af37;color:#000}
.number.sold{background:#444;color:#777;text-decoration:line-through}
.continue{width:100%;margin-top:20px;padding:16px;background:#d4af37;border:none;border-radius:10px;font-weight:bold;font-size:17px}
.total{text-align:center;margin-top:20px;font-size:20px}
.loading{text-align:center;padding:40px;color:#aaa}
.hidden{display:none}
label{display:block;margin-top:15px;margin-bottom:6px;font-weight:bold}
input{width:100%;padding:13px;box-sizing:border-box;background:#1b1b1b;color:white;border:1px solid #444;border-radius:8px}
.message{text-align:center;margin-top:15px;color:#aaa}
.timer{text-align:center;color:#d4af37;font-weight:bold;margin-top:15px}
</style>
</head>

<body>

<header>
<div class="logo">LB <span>RAFFLES</span></div>
</header>

<div class="container">

<div id="loading" class="loading">
Loading competition...
</div>

<div id="competition" class="hidden">

<div class="hero">
<div class="badge">LIVE COMPETITION</div>
<h1 id="title"></h1>
<div class="prize" id="prize"></div>
</div>

<div class="card">

<div class="price">
£<span id="price"></span> per number
</div>

<p id="description"></p>

<div id="numbers" class="grid"></div>

<div class="total">
Selected: <span id="selected">0</span><br>
Total: £<span id="total">0.00</span>
</div>

<button class="continue" onclick="showDetails()">
CONTINUE
</button>

</div>

<div id="details" class="card hidden">

<h2>Your Details</h2>

<label>Full name</label>
<input id="customerName" type="text" placeholder="Enter your full name">

<label>Email address</label>
<input id="customerEmail" type="email" placeholder="Enter your email">

<label>Phone number</label>
<input id="customerPhone" type="tel" placeholder="Enter your phone number">

<button class="continue" onclick="saveEntry()">
RESERVE NUMBERS
</button>

<div id="message" class="message"></div>

<div id="timer" class="timer"></div>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://qyimcrigxsoqcdcajikq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZFz80NnFNaLJB3t-JZ-cig_YRwRdCUz";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let competition;
let selectedNumbers = [];
let soldNumbers = [];
let reservationTimer;

async function loadCompetition(){

const result = await db
.from("competitions")
.select("*")
.eq("active",true)
.order("created_at",{ascending:false})
.limit(1);

if(result.error){
document.getElementById("loading").textContent =
"Unable to load competition.";
return;
}

if(!result.data || result.data.length === 0){
document.getElementById("loading").textContent =
"No competition currently live.";
return;
}

competition = result.data[0];

await loadSoldNumbers();

document.getElementById("loading").style.display="none";
document.getElementById("competition").classList.remove("hidden");

document.getElementById("title").textContent =
competition.title;

document.getElementById("prize").textContent =
competition.prize;

document.getElementById("price").textContent =
Number(competition.price).toFixed(2);

document.getElementById("description").textContent =
competition.description || "";

createNumbers();
}

async function loadSoldNumbers(){

const result = await db
.from("entries")
.select("number,status,reserved_until")
.eq("competition_id",competition.id)
.in("status",["reserved","paid"]);

if(result.error){
console.log(result.error);
return;
}

const now = new Date();

soldNumbers = result.data
.filter(entry => {

if(entry.status === "paid"){
return true;
}

if(!entry.reserved_until){
return true;
}

return new Date(entry.reserved_until) > now;

})
.map(entry => entry.number);
}

function createNumbers(){

const box = document.getElementById("numbers");

box.innerHTML="";

for(let i=1;i<=competition.total_numbers;i++){

const button = document.createElement("button");

button.className="number";
button.textContent=i;

if(soldNumbers.includes(i)){

button.classList.add("sold");
button.disabled=true;

}else{

button.onclick=function(){

if(selectedNumbers.includes(i)){

selectedNumbers =
selectedNumbers.filter(n => n !== i);

button.classList.remove("selected");

}else{

selectedNumbers.push(i);

button.classList.add("selected");

}

updateTotal();

};

}

box.appendChild(button);
}
}

function updateTotal(){

document.getElementById("selected").textContent =
selectedNumbers.length;

document.getElementById("total").textContent =
(
selectedNumbers.length *
Number(competition.price)
).toFixed(2);
}

function showDetails(){

if(selectedNumbers.length === 0){

alert("Please select at least one number.");
return;

}

document.getElementById("details")
.classList.remove("hidden");

document.getElementById("details")
.scrollIntoView({behavior:"smooth"});
}

async function saveEntry(){

const name =
document.getElementById("customerName").value.trim();

const email =
document.getElementById("customerEmail").value.trim();

const phone =
document.getElementById("customerPhone").value.trim();

const message =
document.getElementById("message");

if(!name || !email || !phone){

message.textContent =
"Please complete all your details.";

return;
}

message.textContent =
"Reserving your numbers...";

const reservedUntil =
new Date(Date.now() + 10 * 60 * 1000).toISOString();

const entries = selectedNumbers.map(number => ({

competition_id: competition.id,
number: number,
customer_name: name,
customer_email: email,
customer_phone: phone,
status: "reserved",
reserved_until: reservedUntil

}));

const result = await db
.from("entries")
.insert(entries);

if(result.error){

if(result.error.code === "23505"){

message.textContent =
"One or more of those numbers has just been taken. Please choose another number.";

}else{

message.textContent =
"Something went wrong. Please try again.";
}

return;
}

message.textContent =
"Your numbers have been reserved.";

selectedNumbers.forEach(number => {

if(!soldNumbers.includes(number)){
soldNumbers.push(number);
}

});

createNumbers();

startTimer();

}

function startTimer(){

let seconds = 600;

updateTimer(seconds);

clearInterval(reservationTimer);

reservationTimer = setInterval(function(){

seconds--;

updateTimer(seconds);

if(seconds <= 0){

clearInterval(reservationTimer);

document.getElementById("timer").textContent =
"Your reservation has expired.";

selectedNumbers = [];

location.reload();

}

},1000);

}

function updateTimer(seconds){

const minutes =
Math.floor(seconds / 60);

const remainingSeconds =
seconds % 60;

document.getElementById("timer").textContent =
"Numbers reserved for " +
minutes + ":" +
String(remainingSeconds).padStart(2,"0");

}

loadCompetition();

</script>

</body>
</html>
