<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LB Raffles</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080808;
  color: white;
}

header {
  text-align: center;
  padding: 25px;
  border-bottom: 1px solid #333;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 2px;
}

.logo span {
  color: #d4af37;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 25px 15px;
}

.hero {
  text-align: center;
  padding: 30px 0;
}

.badge {
  background: #d4af37;
  color: black;
  padding: 8px 15px;
  border-radius: 20px;
  font-weight: bold;
}

h1 {
  font-size: 35px;
}

.prize {
  color: #d4af37;
  font-size: 25px;
  font-weight: bold;
}

.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 15px;
  padding: 20px;
}

.price {
  font-size: 24px;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-top: 20px;
}

.number {
  padding: 14px 5px;
  background: #1b1b1b;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
  font-weight: bold;
}

.number.selected {
  background: #d4af37;
  color: black;
}

button.continue {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  background: #d4af37;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
}

.total {
  text-align: center;
  margin-top: 20px;
  font-size: 20px;
}

.loading {
  text-align: center;
  padding: 40px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">LB <span>RAFFLES</span></div>
</header>

<div class="container">

  <div id="loading" class="loading">
    Loading competition...
  </div>

  <div id="competition" style="display:none;">

    <div class="hero">
      <div class="badge">LIVE COMPETITION</div>

      <h1 id="title"></h1>

      <div class="prize" id="prize"></div>
    </div>

    <div class="card">

      <div class="price">
        £<span id="price"></span> per number
      </div>

      <p id="description"></p>

      <div id="numbers" class="grid"></div>

      <div class="total">
        Selected: <span id="selected">0</span><br>
        Total: £<span id="total">0.00</span>
      </div>

      <button class="continue" onclick="continueEntry()">
        CONTINUE
      </button>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://qyimcrigxsoqcdcajikq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZFz80NnFNaLJB3t-JZ-cig_YRwRdCUz";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let competition;
let selectedNumbers = [];

async function loadCompetition() {

  const result = await db
    .from("competitions")
    .select("*")
    .eq("active", true)
    .order("created_at", { ascending: false })
    .limit(1);

  if (result.error) {
    document.getElementById("loading").textContent =
      "Unable to load competition.";
    return;
  }

  if (!result.data || result.data.length === 0) {
    document.getElementById("loading").textContent =
      "No competition currently live.";
    return;
  }

  competition = result.data[0];

  document.getElementById("loading").style.display = "none";
  document.getElementById("competition").style.display = "block";

  document.getElementById("title").textContent =
    competition.title;

  document.getElementById("prize").textContent =
    competition.prize;

  document.getElementById("price").textContent =
    Number(competition.price).toFixed(2);

  document.getElementById("description").textContent =
    competition.description || "";

  createNumbers();
}

function createNumbers() {

  const box = document.getElementById("numbers");

  box.innerHTML = "";

  for (
    let i = 1;
    i <= competition.total_numbers;
    i++
  ) {

    const button = document.createElement("button");

    button.className = "number";

    button.textContent = i;

    button.onclick = function() {

      if (selectedNumbers.includes(i)) {

        selectedNumbers =
          selectedNumbers.filter(n => n !== i);

        button.classList.remove("selected");

      } else {

        selectedNumbers.push(i);

        button.classList.add("selected");
      }

      updateTotal();
    };

    box.appendChild(button);
  }
}

function updateTotal() {

  document.getElementById("selected").textContent =
    selectedNumbers.length;

  document.getElementById("total").textContent =
    (
      selectedNumbers.length *
      Number(competition.price)
    ).toFixed(2);
}

function continueEntry() {

  if (selectedNumbers.length === 0) {

    alert("Please select at least one number.");

    return;
  }

  alert(
    "Numbers selected: " +
    selectedNumbers.sort((a,b) => a-b).join(", ") +
    "\n\nTotal: £" +
    (
      selectedNumbers.length *
      Number(competition.price)
    ).toFixed(2)
  );
}

loadCompetition();

</script>

</body>
</html>
